[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopnotify"
version = "0.1.0"
description = "Order-alert notifications for small shops: personalised Telegram and WhatsApp messages rendered from a customer CSV, with a full delivery log."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
shopnotify = "shopnotify.notifier:main"

[tool.setuptools.packages.find]
include = ["shopnotify*"]
